name: Inactieve issues automatisch sluiten

on:
  schedule:
    - cron: "37 3 * * *"

permissions:
  issues: write

jobs:
  close-inactive-issues:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14

          stale-issue-label: "inactief"

          stale-issue-message: >
            Dit issue heeft al 60 dagen geen activiteit gehad.
            Als er binnen 14 dagen geen nieuwe reactie of activiteit plaatsvindt,
            wordt dit issue automatisch gesloten.

          close-issue-message: >
            Dit issue is automatisch gesloten omdat er na de melding van inactiviteit
            gedurende 14 dagen geen nieuwe activiteit is geweest.
            Als het probleem nog steeds bestaat, kun je het issue opnieuw openen
            of een nieuwe reactie plaatsen.

          days-before-pr-stale: -1
          days-before-pr-close: -1

          repo-token: ${{ secrets.GITHUB_TOKEN }}
